name: Publish to npm

on:
    push:
        branches:
            - main
        tags:
            - 'v*.*.*'

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
                  package-manager-cache: false

            - name: Install dependencies
              run: yarn install

            - name: Auto-bump version on main push if needed
              if: github.ref == 'refs/heads/main'
              run: |
                  CURRENT_VERSION=$(node -p "require('./package.json').version")
                  EXISTS=$(npm view get-elementa-ui@$CURRENT_VERSION version 2>/dev/null || echo "")
                  if [ "$EXISTS" = "$CURRENT_VERSION" ]; then
                      echo "Version $CURRENT_VERSION already exists on npm. Auto-bumping patch version..."
                      npm version patch --no-git-tag-version
                      NEW_VERSION=$(node -p "require('./package.json').version")
                      git config user.name "github-actions[bot]"
                      git config user.email "github-actions[bot]@users.noreply.github.com"
                      git commit -am "chore(release): bump version to $NEW_VERSION [skip ci]" || true
                      git tag "v$NEW_VERSION" || true
                      git push origin main --tags || true
                  else
                      echo "Version $CURRENT_VERSION does not exist on npm yet. Proceeding to publish."
                  fi

            - name: Build package
              run: yarn build

            - name: Publish to npm
              run: npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
